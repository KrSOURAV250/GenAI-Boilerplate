[project]
name = "genai-boilerplate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kr. SOURAV", email = "Kr.SOURAV250@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-postgres>=0.0.19",
    "python-decouple>=3.8",
]

[project.scripts]
genai-boilerplate = "genai_boilerplate:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
